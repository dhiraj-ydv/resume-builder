name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: CLI help
        run: node bin/resume-builder.mjs --help

      - name: Init workspace and start server
        shell: bash
        run: |
          workdir="${RUNNER_TEMP}/resume-workspace"
          node bin/resume-builder.mjs init "$workdir"
          node bin/resume-builder.mjs serve --dir "$workdir" --port 4173 --no-open &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/api/health" >/dev/null; then
              curl -fsS "http://127.0.0.1:4173/api/health"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy"
          exit 1
