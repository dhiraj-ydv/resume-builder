<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Resume Builder</a>
    <p id="workspace-path" class="workspace-path">Loading workspace…</p>
    <p id="save-status" class="save-status" hidden></p>
  </header>

  <main id="app" class="app"></main>

  <dialog id="create-dialog" class="dialog">
    <form id="create-form" method="dialog">
      <h2>New resume</h2>
      <p>Each resume is a role-specific variant. Shared contact details live in your profile.</p>
      <label>
        <span>Target role / title</span>
        <input id="create-title" name="title" required placeholder="Technical Product Manager" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="create-cancel">Cancel</button>
        <button type="submit" class="primary">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
