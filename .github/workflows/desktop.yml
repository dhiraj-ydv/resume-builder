name: Desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run version:check -- "${GITHUB_REF_NAME}"
          else
            npm run version:check
          fi
      - run: npm run desktop:prepare

      - name: Prepare optional Windows code signing
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            'available=false' >> $env:GITHUB_OUTPUT
            '### Windows installer is unsigned' >> $env:GITHUB_STEP_SUMMARY
            'No code-signing secrets were configured. The workflow will produce an unsigned installer.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must either both be configured or both be absent.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'resume-builder-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $certificate = $importedCertificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) {
            throw 'The imported Windows signing certificate has no private key.'
          }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          'available=true' >> $env:GITHUB_OUTPUT
          '### Windows installer is signed' >> $env:GITHUB_STEP_SUMMARY

      - name: Configure Windows code signing
        if: steps.windows_signing.outputs.available == 'true'
        run: node scripts/write-windows-signing-config.mjs

      - name: Build signed Windows installer
        if: steps.windows_signing.outputs.available == 'true'
        run: npm run tauri build -- --config src-tauri/tauri.windows-signing.conf.json --bundles nsis

      - name: Build unsigned Windows installer
        if: steps.windows_signing.outputs.available != 'true'
        run: npm run tauri build -- --bundles nsis

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.release_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_arch: x64
            runner: ubuntu-22.04
          - release_arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            libfuse2 libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            patchelf pkg-config wget xvfb

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: linux-${{ matrix.release_arch }}

      - run: npm ci
      - name: Verify release version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run version:check -- "${GITHUB_REF_NAME}"
          else
            npm run version:check
          fi
      - run: npm run desktop:prepare
      - name: Build AppImage payload
        run: npm run tauri build -- --bundles appimage
      - name: Create prebuilt release archive
        run: sh scripts/package-linux-release.sh "${{ matrix.release_arch }}"

      - name: Smoke-test packaged application
        run: |
          mkdir "${RUNNER_TEMP}/resume-builder-smoke"
          tar -xzf "dist/linux/resume-builder-linux-${{ matrix.release_arch }}.tar.gz" \
            -C "${RUNNER_TEMP}/resume-builder-smoke"
          xvfb-run -a "${RUNNER_TEMP}/resume-builder-smoke/app/AppRun" --help

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.release_arch }}
          path: |
            dist/linux/resume-builder-linux-${{ matrix.release_arch }}.tar.gz
            dist/linux/resume-builder-linux-${{ matrix.release_arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish all desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag --generate-notes --title "Resume Builder ${GITHUB_REF_NAME}"
