name: Build and Upload Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'resume.html'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-resume-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Generate PDF
        run: npm run build:pdf

      - name: Upload PDF to Cloudflare R2
        shell: bash
        run: |
          aws s3 cp dist/resume.pdf "s3://${R2_BUCKET}/resume.pdf" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/pdf" \
            --content-disposition 'attachment; filename="Dhiraj-Resume.pdf"' \
            --cache-control "public, max-age=3600"
