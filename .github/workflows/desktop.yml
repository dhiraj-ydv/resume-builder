name: Windows desktop download

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run version:check -- "${GITHUB_REF_NAME}"
          else
            npm run version:check
          fi
      - run: npm run desktop:prepare

      - name: Prepare optional Windows code signing
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            'available=false' >> $env:GITHUB_OUTPUT
            '### Windows installer is unsigned' >> $env:GITHUB_STEP_SUMMARY
            'No code-signing secrets were configured. The workflow will produce an unsigned installer.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must either both be configured or both be absent.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'resume-builder-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $certificate = $importedCertificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) {
            throw 'The imported Windows signing certificate has no private key.'
          }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          'available=true' >> $env:GITHUB_OUTPUT
          '### Windows installer is signed' >> $env:GITHUB_STEP_SUMMARY

      - name: Configure Windows code signing
        if: steps.windows_signing.outputs.available == 'true'
        run: node scripts/write-windows-signing-config.mjs

      - name: Build signed Windows installer
        if: steps.windows_signing.outputs.available == 'true'
        run: npm run tauri build -- --config src-tauri/tauri.windows-signing.conf.json --bundles nsis

      - name: Build unsigned Windows installer
        if: steps.windows_signing.outputs.available != 'true'
        run: npm run tauri build -- --bundles nsis

      - name: Prepare stable Windows download
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }
          $downloadDirectory = New-Item -ItemType Directory -Force dist/windows
          $stableInstaller = Join-Path $downloadDirectory.FullName 'Resume-Builder-Windows-x64-setup.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller
          $hash = (Get-FileHash -Algorithm SHA256 $stableInstaller).Hash.ToLowerInvariant()
          "$hash  Resume-Builder-Windows-x64-setup.exe" | Set-Content -Encoding ascii "$stableInstaller.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/windows/Resume-Builder-Windows-x64-setup.exe
            dist/windows/Resume-Builder-Windows-x64-setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item dist/windows/Resume-Builder-Windows-x64-setup.exe
          $checksum = Get-Item dist/windows/Resume-Builder-Windows-x64-setup.exe.sha256
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer.FullName $checksum.FullName --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum.FullName --verify-tag --generate-notes --title "Resume Builder $env:GITHUB_REF_NAME"
          }
          $allowedAssets = @(
            'Resume-Builder-Windows-x64-setup.exe',
            'Resume-Builder-Windows-x64-setup.exe.sha256'
          )
          $releaseAssets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          foreach ($asset in $releaseAssets) {
            if ($asset -and $asset -notin $allowedAssets) {
              gh release delete-asset $env:GITHUB_REF_NAME $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove obsolete release asset: $asset" }
            }
          }
          gh release edit $env:GITHUB_REF_NAME --target $env:GITHUB_SHA --verify-tag --draft=false --prerelease=false --latest

  publish-flatpak:
    name: Request Flatpak publication
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dispatch immutable release to the Flatpak repository
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPOSITORY_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "FLATPAK_REPOSITORY_TOKEN is required to publish Linux releases." >&2
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          version=${GITHUB_REF_NAME#v}
          jq -n \
            --arg commit "$source_commit" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg version "$version" \
            '{event_type:"resume-builder-release",client_payload:{source_commit:$commit,release_tag:$tag,version:$version}}' | \
            gh api --method POST \
              repos/exolithelabs/exolithelabs-flatpak-repo/dispatches \
              --input -
